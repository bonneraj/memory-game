=<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <style>
    /* General page layout */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px;
      background-color: #f0f4f8;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Board grid */
    #board {
      display: grid;
      grid-template-columns: repeat(4, 100px);
      grid-gap: 15px;
      margin-bottom: 20px;
    }

    .tile {
      width: 100px;
      height: 100px;
      font-size: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border: 2px solid #333;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      user-select: none;
    }

    .tile:hover {
      transform: scale(1.05);
      background-color: #e0e7ff;
    }

    .tile.removed {
      opacity: 0.5;
      cursor: default;
    }

    .tile.selected {
      border: 3px solid #facc15;
    }

    /* Bookshelf display */
    #books {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 450px;
      margin-bottom: 20px;
    }

    .book {
      font-size: 2.5rem;
      margin: 5px 8px;
    }

    /* Panels */
    #guess-panel, #flip-back-panel {
      margin-bottom: 15px;
    }

    .hidden {
      display: none;
    }

    /* Buttons */
    button {
      font-size: 1.2rem;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background-color: #4f46e5;
      color: #fff;
      transition: background-color 0.2s, transform 0.2s;
    }

    button:hover {
      background-color: #6366f1;
      transform: scale(1.05);
    }

    /* Results display */
    #wheel-result {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    #score {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h1>Memory Game</h1>

  <div id="books"></div>

  <div id="board"></div>

  <div id="wheel-result"></div>
  <button id="spin-btn">Spin Wheel</button>

  <div id="guess-panel" class="hidden">
    <p>Pick the correct book:</p>
    <div id="guess-options"></div>
  </div>

  <div id="flip-back-panel" class="hidden">
    <button id="flip-back-btn">Flip Card Back</button>
  </div>

  <div>Score: <span id="score">0</span></div>

  <script src="script.js"></script>
</body>
</html>
